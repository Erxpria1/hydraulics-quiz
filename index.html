<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CE6301 Hydraulics Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<!-- KaTeX -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <!-- Header -->
  <header id="header">
    <div class="header-bg">
      <div class="header-gradient"></div>
      <div class="header-particles"></div>
    </div>
    <div class="header-content">
      <div class="header-left">
        <div class="logo-container">
          <span class="logo-icon">💧</span>
          <div class="logo-text">
            <h1>HİDROLİK</h1>
            <span class="logo-sub">Quiz Sorular 1-2-3</span>
          </div>
        </div>
      </div>
      <div class="header-center">
        <button class="header-star-btn" id="headerStarBtn">
          <span class="star-icon">★</span>
          <span class="star-label">Yıldızlı</span>
          <span class="star-badge" id="headerStarBadge">0</span>
        </button>
      </div>
      <div class="header-right">
        <div class="lang-toggle" id="langToggle">
          <button class="lang-btn active" data-lang="en">EN</button>
          <button class="lang-btn" data-lang="tr">TR</button>
        </div>
      </div>
    </div>
    <div class="yaver-imza">
      <span>by Yaver 🤖</span>
    </div>
  </header>

  <!-- Progress Bar -->
  <div class="progress-container">
    <div class="progress-bar" id="progressBar"></div>
    <span class="progress-text" id="progressText"></span>
  </div>

  <!-- Score -->
  <div class="score-bar">
    <div class="score-item">
      <span data-en="Score" data-tr="Skor">Score</span>: <span id="scoreDisplay">0</span> / <span id="totalDisplay">0</span>
    </div>
    <div class="score-item">
      <span data-en="Correct" data-tr="Doğru">Correct</span>: <span id="correctCount">0</span>
    </div>
    <div class="score-item">
      <span data-en="Wrong" data-tr="Yanlış">Wrong</span>: <span id="wrongCount">0</span>
    </div>
  </div>

  <!-- Starred Questions Modal -->
  <div class="modal-overlay" id="starredModal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>★ Yıldızlı Sorular</h3>
        <button class="modal-close" id="closeStarredModal">✕</button>
      </div>
      <div class="modal-body" id="starredList"></div>
    </div>
  </div>

  <!-- Filter Tabs -->
  <div class="filter-tabs">
    <button class="filter-btn active" data-filter="all" data-en="All" data-tr="Tümü">All</button>
    <button class="filter-btn" data-filter="ex1" data-en="Ex I: Dimensional" data-tr="Soru I: Boyutsal">Ex I: Dimensional</button>
    <button class="filter-btn" data-filter="ex2" data-en="Ex II: Model" data-tr="Soru II: Model">Ex II: Model</button>
    <button class="filter-btn" data-filter="ex3" data-en="Ex III: Pipe" data-tr="Soru III: Boru">Ex III: Pipe</button>
  </div>

  <!-- Question Card -->
  <div class="question-card" id="questionCard">
    <div class="question-header">
      <span class="question-number" id="questionNumber"></span>
      <span class="question-exercise" id="questionExercise"></span>
      <div class="header-tools">
        <button class="star-btn" id="starBtn" title="Yıldızla">☆</button>
        <button class="hoporlor-btn" id="hoporlorBtn" data-en="🎧 Listen" data-tr="🎧 Dinle">🎧 Dinle</button>
        <button class="calc-btn" id="calcBtn">🧮</button>
      </div>
    </div>
    <div class="question-text" id="questionText"></div>
    <div class="question-image" id="questionImage"></div>

    <!-- Options (for multiple choice) -->
    <div class="options-container" id="optionsContainer"></div>

    <!-- Numeric Answer -->
    <div class="numeric-answer" id="numericAnswer" style="display:none;">
      <label data-en="Your Answer:" data-tr="Cevabınız:" for="numericInput">Your Answer:</label>
      <input type="number" id="numericInput" step="any" placeholder="">
      <span class="unit" id="unitDisplay"></span>
      <button class="check-btn" id="checkNumeric" data-en="Check" data-tr="Kontrol Et">Check</button>
    </div>

    <!-- Solution -->
    <div class="solution-container" id="solutionContainer" style="display:none;">
      <div class="solution-header">
        <span data-en="Solution" data-tr="Çözüm">Solution</span>
        <button class="audio-btn" id="audioBtn" title="Çözümü Dinle">🔊</button>
      </div>
      <div class="solution-text" id="solutionText"></div>
    </div>

    <!-- Action Buttons -->
    <div class="action-buttons">
      <button class="btn btn-show" id="showSolutionBtn" data-en="Show Solution" data-tr="Çözümü Göster">Show Solution</button>
      <button class="btn btn-next" id="nextBtn" data-en="Next Question" data-tr="Sonraki Soru">Next Question</button>
    </div>
  </div>

  <!-- Navigation -->
  <div class="navigation">
    <button class="btn btn-prev" id="prevBtn" data-en="← Previous" data-tr="← Önceki">← Önceki</button>
    <div class="question-dots" id="questionDots"></div>
    <button class="btn btn-nav-next" id="nextNavBtn" data-en="Next →" data-tr="Sonraki →">Sonraki →</button>
  </div>
</div>

<!-- Calculator - Floating & Draggable -->
<div class="yaver-calc" id="yaverCalc">
  <div class="yaver-calc-header" id="calcDragHandle">
    <span class="yaver-calc-title">🧮 Yaver Hesap Aygıtı</span>
    <div class="yaver-calc-controls">
      <button class="calc-minimize" id="calcMinimize">─</button>
      <button class="calc-close-float" id="calcCloseFloat">✕</button>
    </div>
  </div>
  <div class="yaver-calc-body" id="calcBody">
    <input type="text" class="yaver-calc-display" id="calcDisplay" readonly>
    <div class="yaver-calc-history" id="calcHistory"></div>
    <div class="yaver-calc-buttons" id="calcButtons">
      <div class="calc-row">
        <button class="yaver-btn yaver-btn-fn" data-val="sin">sin</button>
        <button class="yaver-btn yaver-btn-fn" data-val="cos">cos</button>
        <button class="yaver-btn yaver-btn-fn" data-val="tan">tan</button>
        <button class="yaver-btn yaver-btn-fn" data-val="log">log</button>
        <button class="yaver-btn yaver-btn-fn" data-val="ln">ln</button>
      </div>
      <div class="calc-row">
        <button class="yaver-btn yaver-btn-fn" data-val="sqrt">√</button>
        <button class="yaver-btn yaver-btn-fn" data-val="pow">x²</button>
        <button class="yaver-btn yaver-btn-fn" data-val="pi">π</button>
        <button class="yaver-btn yaver-btn-fn" data-val="e">e</button>
        <button class="yaver-btn yaver-btn-fn" data-val="(">(</button>
      </div>
      <div class="calc-row">
        <button class="yaver-btn yaver-btn-num" data-val="7">7</button>
        <button class="yaver-btn yaver-btn-num" data-val="8">8</button>
        <button class="yaver-btn yaver-btn-num" data-val="9">9</button>
        <button class="yaver-btn yaver-btn-op" data-val="/">÷</button>
        <button class="yaver-btn yaver-btn-del" id="calcDel">⌫</button>
      </div>
      <div class="calc-row">
        <button class="yaver-btn yaver-btn-num" data-val="4">4</button>
        <button class="yaver-btn yaver-btn-num" data-val="5">5</button>
        <button class="yaver-btn yaver-btn-num" data-val="6">6</button>
        <button class="yaver-btn yaver-btn-op" data-val="*">×</button>
        <button class="yaver-btn yaver-btn-fn" data-val=")">)</button>
      </div>
      <div class="calc-row">
        <button class="yaver-btn yaver-btn-num" data-val="1">1</button>
        <button class="yaver-btn yaver-btn-num" data-val="2">2</button>
        <button class="yaver-btn yaver-btn-num" data-val="3">3</button>
        <button class="yaver-btn yaver-btn-op" data-val="-">−</button>
        <button class="yaver-btn yaver-btn-eq" id="calcEquals">=</button>
      </div>
      <div class="calc-row">
        <button class="yaver-btn yaver-btn-num" data-val="0">0</button>
        <button class="yaver-btn yaver-btn-num" data-val=".">.</button>
        <button class="yaver-btn yaver-btn-clear" id="calcClear">C</button>
        <button class="yaver-btn yaver-btn-op" data-val="+">+</button>
        <button class="yaver-btn yaver-btn-percent" data-val="%">%</button>
      </div>
    </div>
  </div>
</div>

<!-- Toggle Calculator Button -->
<button class="yaver-calc-toggle" id="yaverCalcToggle">🧮</button>

<script src="questions.js"></script>
<script src="main.js"></script>
</body>
</html>
